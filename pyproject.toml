[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowcept"
dynamic = ["version"]
requires-python = ">=3.11"

authors = [{name = "Oak Ridge National Laboratory"}]
description = "Capture and query workflow provenance data using data observability"
readme = "README.md"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3"
]
keywords = [
    "ai",
    "ml",
    "machine-learning",
    "provenance",
    "lineage",
    "responsible-ai",
    "databases",
    "big-data",
    "provenance",
    "tensorboard",
    "data-integration",
    "scientific-workflows",
    "dask",
    "reproducibility",
    "workflows",
    "parallel-processing",
    "lineage",
    "model-management",
    "mlflow",
    "responsible-ai",
    "data-analytics",
    "agentic-ai",
    "agentic-workflows",
    "llm",
]

dependencies = [
    "omegaconf",
    "numpy",
    "msgpack",
    "orjson",
    "rich",
]

[project.optional-dependencies]
redis = ["redis<8"]
lmdb = ["lmdb"]
telemetry = ["psutil>=6.1.1", "py-cpuinfo"]
extras = ["flowcept[redis]", "flowcept[telemetry]", "flowcept[mongo]", "GitPython", "pandas", "pyarrow", "requests"]
webservice = ["fastapi", "uvicorn", "pyyaml", "sse-starlette"]

report_pdf = ["matplotlib", "reportlab", "networkx"]
mongo = ["pymongo", "pyarrow"]
dask = ["tomli", "dask[distributed]<=2024.10.0"]
docs = ["sphinx", "furo"]
diaspora = ["diaspora-stream-api @ git+https://github.com/diaspora-project/diaspora-stream-api"]
# For the AI-coding-harness plugins (flowcept.agents.harness and friends). The
# capture path is deliberately dependency-free; these extras are only for the
# OTel span exporter and the Claude Agent SDK `trace_query` wrapper.
harness_otel = ["opentelemetry-sdk>=1.20.0"]
harness_claude_sdk = ["claude-agent-sdk>=0.1.0"]
kafka = ["confluent-kafka<=2.8.0"]  # As of today, 2/28/2025, version 2.8.1 is stale. When this gets fixed, let's remove the version constraint. https://pypi.org/project/confluent-kafka/#history
rabbitmq = ["pika"]
mlflow = ["mlflow-skinny", "SQLAlchemy", "alembic", "watchdog", "cryptography"]
nvidia = ["nvidia-ml-py"]
amd = ["amdsmi"]
mqtt = ["paho-mqtt"]
tensorboard = ["tensorboard", "tensorflow", "tbparse"]
llm_agent = ["mcp[cli]", "langchain_community", "langchain_openai", "langgraph", "streamlit", "PyMuPDF", "matplotlib", "tabulate"]
llm_google = ["flowcept[llm_agent]", "google-genai"]
llm_agent_audio = ["flowcept[llm_agent]", "streamlit-mic-recorder", "SpeechRecognition", "pydub", "gTTS"]
# System dependency (required for pydub)
# Install ffmpeg on the system (not a pip package):
# macOS (Homebrew): brew install ffmpeg
# Conda (any OS): conda install -c conda-forge ffmpeg
# Debian/Ubuntu: sudo apt-get install ffmpeg

dev = [
    "flowcept[docs]",
    "flowcept[rabbitmq]",
    "jupyterlab",
    "nbmake",
    "pytest",
    "pytest-timeout",
    "ruff",
    "pyyaml",
    "httpx2"
]

# Torch and some other ML-specific libs are only used for dev/test workflows.
ml_dev = [
    "torch>=2.6.0",
    "torchvision",
    "datasets==2.17.0",
    "sacremoses",
    "nltk"
]
all = [
    "flowcept[telemetry]",
    "flowcept[extras]",
    "flowcept[webservice]",
    "flowcept[redis]",
    "flowcept[lmdb]",
    "flowcept[mongo]",
    "flowcept[dask]",
    "flowcept[kafka]",
    "flowcept[rabbitmq]",
    "flowcept[mlflow]",
    "flowcept[mqtt]",
    "flowcept[tensorboard]",
    "flowcept[report_pdf]",
    "flowcept[dev]",
    "flowcept[llm_agent]",
    "flowcept[llm_google]"
]

[tool.hatch.version]
path = "src/flowcept/version.py"


[tool.hatch.metadata]
allow-direct-references = true


[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501", "D"]
ignore = ["D200", "D212", "D105", "D401", "D205", "D100"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.hatch.build.targets.wheel]
packages = ["src/flowcept"]
# Built web UI assets (created by `make ui-build` into the package dir); gitignored but shipped.
artifacts = ["src/flowcept/webservice/ui_build/**"]

[tool.hatch.build.targets.wheel.force-include]
"resources/sample_settings.yaml" = "resources/sample_settings.yaml"

[tool.pytest.ini_options]
markers = [
    "llm: tests that require a real LLM (run locally with env set; excluded from CI except run-llm-tests.yml)",
]
filterwarnings = [
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning",
    "ignore:Use `streamable_http_client` instead\\.:DeprecationWarning",
]

[project.scripts]
flowcept = "flowcept.cli:main"
# AI coding harness provenance capture (flowcept.agents.harness). The capture
# path is stdlib-only, so these need no extras; the MCP server needs [llm_agent]
# (for mcp) and the OTel exporter needs [harness_otel].
flowcept-harness = "flowcept.agents.harness.cli:main"
flowcept-harness-mcp = "flowcept.agents.harness.mcp_server:main"
flowcept-claude-code = "flowcept.agents.claude_code.claude_code_plugin:main"
